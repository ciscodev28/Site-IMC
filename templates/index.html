
{% extends 'base.html' %}

{% block title %}
Início
{% endblock %}

{% block content %}

<section>
    <h1>Bem-vindo ao Portal Saúde & Bem-Estar!</h1>

    <p>
        Este portal reúne ferramentas e informações relacionadas à saúde e ao bem-estar.
    </p>
</section>

<section>
    <h2>Calculadora Matemática</h2>

    <form id="formMatematica">

        <label for="a">Primeiro número:</label>
        <input type="number" id="a" step="any" required>

        <br><br>

        <label for="op">Operação:</label>

        <select id="op" required>
            <option value="soma">Soma</option>
            <option value="subtracao">Subtração</option>
            <option value="multiplicacao">Multiplicação</option>
            <option value="divisao">Divisão</option>
        </select>

        <br><br>

        <label for="b">Segundo número:</label>
        <input type="number" id="b" step="any" required>

        <br><br>

        <button type="submit">
            Calcular
        </button>

    </form>
</section>

<section>
    <h2>Calculadora de IMC</h2>

    <form id="formIMC">

        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" min="0.1" step="any" required>

        <br><br>

        <label for="altura">Altura (m):</label>
        <input type="number" id="altura" min="0.1" step="any" required>

        <br><br>

        <button type="submit">
            Calcular IMC
        </button>

    </form>
</section>

<script>
document.getElementById("formMatematica").addEventListener("submit", function(event) {
    event.preventDefault();

    let a = document.getElementById("a").value;
    let b = document.getElementById("b").value;
    let op = document.getElementById("op").value;

    window.location.href = "/math/" + op + "/" + a + "/" + b;
});

document.getElementById("formIMC").addEventListener("submit", function(event) {
    event.preventDefault();

    let peso = document.getElementById("peso").value;
    let altura = document.getElementById("altura").value;

    window.location.href = "/imc/" + peso + "/" + altura;
});
</script>

{% endblock %}
