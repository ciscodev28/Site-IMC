
<header class="header">

    <div class="header-container">

        <a href="{{ url_for('inicio') }}" class="logo">
            <span class="logo-icon">+</span>
            <span>Saúde<span>&</span>Bem-Estar</span>
        </a>

        <nav class="navbar">

            <a href="{{ url_for('inicio') }}">Início</a>

            <a href="{{ url_for('sobre') }}">Sobre</a>

            {% if session.get('user_id') %}

                <a href="{{ url_for('perfil') }}" class="profile-link">
                    Perfil
                </a>

                {% if session.get('funcao') == 'admin' %}

                    <a href="{{ url_for('painel_admin') }}">
                        Administração
                    </a>

                {% endif %}

                <a href="{{ url_for('logout') }}">
                    Sair
                </a>

            {% else %}

                <a href="{{ url_for('login') }}">
                    Login
                </a>

                <a href="{{ url_for('cadastro') }}">
                    Cadastro
                </a>

            {% endif %}

        </nav>

    </div>

</header>
