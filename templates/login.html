{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<body>
    <section class="alin">
        <h1>Login</h1>

        <form action="{{ url_for('login') }}" method="POST">

            <label for="usuario">Usuário:</label>
            <input type="text" id="usuario" name="usuario" required>

            <br><br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>

            <button type="button" id="mostrarSenha">
                👁️
            </button>

            <p id="avisoCapsLock" style="display: none;">
                ⚠️ Caps Lock está ativado!
            </p>

            <br>
 </section>
 <br><br>
 <section class="alin">
        <h2>Dados do perfil</h2>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" required>

        <br><br>

        <label for="sexo">Sexo</label>

        <select name="sexo" id="sexo" required>
            <option value="">Selecione</option>
            <option value="maculino">Masculino</option>
            <option value="feminino">Feminino</option>

        </select>

        <br><br>
        
        <label for="peso">Peso:</label>
        <input type="number" id="peso" name="peso" step="any" required>

        <br><br>

        <label for="altura">Altura:</label>
        <input type="number" id="altura" name="altura" step="any" required>

        <br><br>

        <button type="submit">
            Entrar
        </button>

    </form>
    <script>

        const senha = document.getElementById("senha");
        const botaoSenha = document.getElementById("mostrarSenha");
        const avisoCapsLock = document.getElementById("avisoCapsLock");

        botaoSenha.addEventListener("click", function() { });

        document.addEventListener("keydown", function(event) {

            if (event.getModifierState("CapsLock")) {
                avisoCapsLock.style.display = "block";
            } else {
                avisoCapsLock.style.display = "none";
            }

        });
    </script>
 </section>
</body>
{% endblock %}
